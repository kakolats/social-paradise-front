<div class="fixed bottom-4 right-4 z-[80] select-none">
    <div class="flex items-center gap-2 rounded-2xl border border-white/15 bg-black/25 px-2 py-2 text-white shadow-lg backdrop-blur sm:px-3">
        <button
            type="button"
            class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-white/10 hover:bg-white/15 disabled:opacity-60 sm:h-10 sm:w-10"
            (click)="audio.togglePlay()"
            [disabled]="audio.hasError()"
            aria-label="Lecture / pause"
        >
            <span class="text-lg font-semibold">
                {{ audio.isPlaying() ? '❚❚' : '▶' }}
            </span>
        </button>

        <div class="hidden min-w-0 sm:block">
            <div class="text-xs font-semibold tracking-wide text-white/90">
                Musique
            </div>
            <div class="truncate text-xs text-white/75">
                {{ statusLabel() }}
            </div>
        </div>

        <button
            type="button"
            class="inline-flex h-9 w-9 items-center justify-center rounded-xl bg-white/10 hover:bg-white/15 disabled:opacity-60 sm:h-10 sm:w-10"
            (click)="audio.toggleMute()"
            [disabled]="audio.hasError()"
            aria-label="Muet"
        >
            <span class="text-base font-semibold">
                {{ audio.isMuted() ? '🔇' : '🔊' }}
            </span>
        </button>
    </div>
</div>
